services:

  backend:
    build:
      context: ./backend
    container_name: campus-connect-backend
    ports:
      - "4000:4000"
        env_file:
      - backend-test.env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/departmentMS
      FRONTEND_URL: http://${EC2_PUBLIC_IP}

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://${EC2_PUBLIC_IP}:4000/api
    container_name: campus-connect-frontend
    ports:
      - "80:3000"
    depends_on:
      - backend

  mongodb:
    image: mongo:7
    container_name: campus-connect-mongodb
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: