services:
  backend:
    build:
      context: ./backend
    container_name: campus-connect-backend
    ports:
      - "4001:4000"
    env_file:
      - backend-test.env

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4001/api
    container_name: campus-connect-frontend
    ports:
      - "3001:3000"
    depends_on:
      - backend